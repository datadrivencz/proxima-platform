entities {
  gateway {
    attributes {
      details {
        scheme: "proto:cz.o2.proxima.direct.sql.proto.Gateway.GatewayDetails"
      }
      owner {
        scheme: string
      }
      streamRegular {
        scheme: bytes
      }
      "streamWildcard.*" {
        scheme: bytes
      }
    }
  }
  user {
    attributes {
      details {
        scheme: "proto:cz.o2.proxima.direct.sql.proto.User.UserDetails"
      }
      "gateway.*" {
        scheme: "proto:cz.o2.proxima.direct.sql.proto.Gateway.UserToGateway"
      }
    }
  }
  stream {
    attributes {
      data {
        scheme: bytes
      }
    }
  }
}

attributeFamilies {

  gateway-random {
    entity: gateway
    attributes: [ "details", "owner" ]
    storage: "inmem:///gateway-details"
    type: primary
    access: [ "random-access", "list-primary-key" ]
  }

  gateway-stream {
    entity: gateway
    attributes: [ "streamRegular", "streamWildcard.*" ]
    storage: "inmem:///gateway-stream"
    type: primary
    access: [ "commit-log" ]
  }

  user-random {
    entity: user
    attributes: [ "details" ]
    storage: "inmem:///user-details"
    type: primary
    access: [ "random-access", "list-primary-key" ]
  }

  user-gateways {
    entity: user
    attributes: [ "gateway.*" ]
    storage: "inmem:///user-gateways"
    type: primary
    access: [ "random-access" ]
  }

  stream {
    entity: stream
    attributes: [ "*" ]
    storage: "inmem:///stream"
    type: primary
    access: [ "commit-log" ]
  }
}
